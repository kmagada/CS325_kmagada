name: Docker CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build Docker image for tests
        run: |
          cd project1
          docker build -t project1:test .

      - name: Run tests
        run: |
          - run: docker build -t myapp . -f project1/Dockerfile --build-context project1=project1/
          docker run --rm myapp pytest -v
