name: Docker CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Build docker image
        run: docker build -t myproj:test .

      - name: Run tests
        run: docker run myproj:test
